[project]
name = "financial-data-pipeline"
version = "0.7.0"
description = "Pipeline de dados financeiros simulados (cooperativa bancária fictícia): Bronze → Silver → Gold → BigQuery, com Airflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Futuro (NÃO instalar agora): Spark/Delta.
spark = ["pyspark>=3.5"]
delta = ["delta-spark>=3.0"]
cloud = ["google-cloud-bigquery>=3.0", "db-dtypes>=1.0"]
dashboard = ["streamlit>=1.32", "google-cloud-bigquery>=3.0", "db-dtypes>=1.0"]
orchestration = ["apache-airflow==2.6.*"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["financial_pipeline"]
