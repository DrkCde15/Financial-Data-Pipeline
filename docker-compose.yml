# Postgres + Airflow 2.6 (LocalExecutor). Sem docker nesta máquina? Instale
# o Docker e rode `docker compose up -d` a partir desta pasta.
#
# Serviços:
#   postgres  — banco serving (finance), porta 5432
#   airflow   — scheduler+webserver standalone (airflow 2.6.3), porta 8080
#               user/senha: admin/admin (TROQUE em produção)
#
# O DAG monta o repo em /opt/airflow/financial-data-pipeline e executa os
# mesmos scripts do README (generate -> bronze -> silver -> gold -> postgres).

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  FINANCIAL_PIPELINE_ROOT: /opt/airflow/financial-data-pipeline
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/finance
  PYTHONPATH: /opt/airflow/financial-data-pipeline/src

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.6.3-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/financial-data-pipeline/scripts
      - ./src:/opt/airflow/financial-data-pipeline/src
      - ./data:/opt/airflow/financial-data-pipeline/data
      - ./sql:/opt/airflow/financial-data-pipeline/sql
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Data --lastname Eng --role Admin --email admin@example.com || true"

  airflow:
    image: apache/airflow:2.6.3-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/financial-data-pipeline/scripts
      - ./src:/opt/airflow/financial-data-pipeline/src
      - ./data:/opt/airflow/financial-data-pipeline/data
      - ./sql:/opt/airflow/financial-data-pipeline/sql
    command: bash -c "pip install -q pandas pyarrow SQLAlchemy 'psycopg2-binary' && airflow standalone"

volumes:
  pgdata:
