# Postgres + Airflow 2.6 (LocalExecutor).
# O Postgres aqui é SÓ o banco de metadados do Airflow — não entra no
# pipeline. O serving é 100% BigQuery sandbox (ver README).
# Com podman: `podman compose up -d` a partir desta pasta.
#
# Serviços:
#   postgres  — metadados do Airflow (db airflow), porta 5432
#   airflow   — scheduler+webserver standalone (airflow 2.6.3), porta 8080
#               user/senha: admin/admin (TROQUE em produção)
#
# O DAG monta o repo em /opt/airflow/financial-data-pipeline e executa os
# mesmos scripts do README (generate -> bronze -> silver -> gold -> postgres/BQ).
# BQ usa o ADC do host montado em ~/.config/gcloud (só leitura).

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  FINANCIAL_PIPELINE_ROOT: /opt/airflow/financial-data-pipeline
  PYTHONPATH: /opt/airflow/financial-data-pipeline/src:/opt/monitoring/src
  GCP_PROJECT: engdta
  BQ_LOCATION: US
  # ADC do host (gcloud auth application-default login) p/ tasks do BigQuery.
  GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
  # Observabilidade (pipeline-monitoring, ver dags/monitoring_callbacks.py):
  # callbacks registram uma run por task (dag_id.task_id) neste SQLite.
  # MIN_ROWS_EXPECTED=0 porque callbacks não reportam linhas (só scripts
  # instrumentados com monitored_run reportam volume).
  DATABASE_PATH: /opt/airflow/financial-data-pipeline/data/monitoring.db
  MIN_ROWS_EXPECTED: "0"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.6.3-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/financial-data-pipeline/scripts
      - ./src:/opt/airflow/financial-data-pipeline/src
      - ./data:/opt/airflow/financial-data-pipeline/data
      - ./sql:/opt/airflow/financial-data-pipeline/sql
      - ../pipeline-monitoring/src:/opt/monitoring/src:ro
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Data --lastname Eng --role Admin --email admin@example.com || true"

  airflow:
    image: apache/airflow:2.6.3-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/financial-data-pipeline/scripts
      - ./src:/opt/airflow/financial-data-pipeline/src
      - ./data:/opt/airflow/financial-data-pipeline/data
      - ./sql:/opt/airflow/financial-data-pipeline/sql
      - ../pipeline-monitoring/src:/opt/monitoring/src:ro
      - ~/.config/gcloud:/home/airflow/.config/gcloud:ro
    command: bash -c "pip install -q pandas pyarrow google-cloud-bigquery && airflow standalone"

volumes:
  pgdata:
